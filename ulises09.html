    <script>
      const HP_API_URL = "https://hp-api.onrender.com/api/characters";
      const RM_API_URL = "https://rickandmortyapi.com/api/character";

      const charactersGrid = document.getElementById("characters-grid");
      const form = document.getElementById("form");
      const search = document.getElementById("search");

      getAllCharacters();

      async function getAllCharacters() {
        const [rmRes, hpRes] = await Promise.all([
          fetch(RM_API_URL).then((res) => res.json()),
          fetch(HP_API_URL).then((res) => res.json()),
        ]);

        const rickChars = rmRes.results || [];
        const harryChars = hpRes || [];

        showCharacters(harryChars, rickChars);
      }

      async function getCharacters(hp_url, rm_url) {
          try {
            // Harry Potter - obtener todos y filtrar localmente (no soporta búsqueda por URL)
            const hpRes = await fetch(HP_API_URL);
            const hpData = await hpRes.json();
            const searchTerm = new URLSearchParams(hp_url.split('?')[1]).get('name');
            const harryChars = hpData.filter(char => 
              char.name && char.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Rick & Morty - usar la URL de búsqueda
            const rmRes = await fetch(rm_url);
            const rmData = await rmRes.json();
            const rickChars = rmData.results || [];

            showCharacters(harryChars, rickChars);
          } catch (error) {
            console.error('Error en búsqueda:', error);
            showCharacters([], []);
          }
        }

      function showCharacters(charactersHP, charactersRM) {
        main.innerHTML = "";

        charactersHP.forEach((char) => {
          const { name, image, house, species } = char;
            const charElement = document.createElement("div");
            charElement.classList.add("character-card");
            charElement.innerHTML = `
                        <div class="character-image">
                            <img src="${image}" alt="${name}" onerror="this.parentElement.style.display='none'">
                            
                        </div>
                        <div class="character-info">
                            <h3 class="character-name">${name}</h3>
                            <div class="character-details">
                                <p><strong>Casa:</strong> ${
                                  house || "Desconocida"
                                }</p>
                                <p><strong>Especie:</strong> ${
                                  species || "Desconocida"
                                }</p>
                                <div class="api-tag hp-tag">Harry Potter</div>
                            </div>
                        </div>
                    `;
            main.appendChild(charElement);
        });

        charactersRM.forEach((char) => {
          const { id, name, image, species, status, origin } = char;
          const charElement = document.createElement("div");
          charElement.classList.add("character-card");
          charElement.innerHTML = `
                    <div class="character-image">
                        <img src="${image}" alt="${name}">
                        
                    </div>
                    <div class="character-info">
                        <h3 class="character-name">${name}</h3>
                        <div class="character-details">
                            <p><strong>Estado:</strong> ${status}</p>
                            <p><strong>Especie:</strong> ${species}</p>
                            <p><strong>Origen:</strong> ${origin.name}</p>
                            <div class="api-tag rm-tag">Rick & Morty</div>
                        </div>
                    </div>
                `;
          main.appendChild(charElement);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const searchTerm = search.value.toLowerCase();
        if (searchTerm && searchTerm !== "") {
          getCharacters(
            HP_API_URL + `?name=${searchTerm}`,
            RM_API_URL + `?name=${searchTerm}`
          );
          search.value = "";
        } else {
          window.location.reload();
        }
      });
    </script>
